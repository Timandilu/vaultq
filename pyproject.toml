[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultq"
version = "0.2.0"
description = "Portable TUI, CLI, and MCP toolkit for indexing markdown vaults into Postgres + Qdrant with contextual hybrid retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Timon Wendland"}]
dependencies = [
  "fastmcp>=3.2,<4",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "textual>=8.2,<9",
  "tiktoken>=0.9,<1",
]

[project.scripts]
vq = "vaultq.cli:main"
vaultq = "vaultq.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
