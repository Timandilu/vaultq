[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultq"
version = "0.1.0"
description = "QMD-style CLI for indexing markdown vaults into Postgres + Qdrant with contextual retrieval."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Timan"}]
dependencies = [
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "qdrant-client[fastembed]>=1.14.2,<2",
  "tiktoken>=0.9,<1",
]

[project.scripts]
vq = "vaultq.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
